spring:
  datasource:
    url: jdbc:mysql://localhost:33307/control-informacion?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: developer
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none # O usa validate / none / create / create-drop según tu necesidad
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  # Opcional: formato legible para logs SQL
  properties:
    hibernate:
      format_sql: true
